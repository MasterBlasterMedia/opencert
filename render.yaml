# Deployment proposal: the worker uses a PAID plan. Do not apply without the operator's cost approval.
# Migrate Neon separately using the DIRECT connection before deploying these services.
services:
  - type: web
    name: opencert
    runtime: docker
    region: ohio
    plan: free
    dockerfilePath: ./deploy/api.Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
      - key: Web__Origin
        sync: false
      - key: ConnectionStrings__Database
        sync: false
      - key: Security__KeyEncryptionCertificateBase64
        sync: false
      - key: Security__KeyEncryptionPassword
        sync: false
      - key: Email__ResendApiKey
        sync: false
      - key: Email__From
        sync: false
      - key: Acme__Directory
        value: https://acme-staging-v02.api.letsencrypt.org/directory
      - key: Acme__ContactEmail
        sync: false
  - type: worker
    name: opencert-worker
    runtime: docker
    region: ohio
    plan: 0.5c-512mb
    dockerfilePath: ./deploy/worker.Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    envVars:
      - key: DOTNET_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Database
        fromService: {type: web, name: opencert, envVarKey: ConnectionStrings__Database}
      - key: Security__KeyEncryptionCertificateBase64
        fromService: {type: web, name: opencert, envVarKey: Security__KeyEncryptionCertificateBase64}
      - key: Security__KeyEncryptionPassword
        fromService: {type: web, name: opencert, envVarKey: Security__KeyEncryptionPassword}
      - key: Email__ResendApiKey
        fromService: {type: web, name: opencert, envVarKey: Email__ResendApiKey}
      - key: Email__From
        fromService: {type: web, name: opencert, envVarKey: Email__From}
      - key: Acme__Directory
        fromService: {type: web, name: opencert, envVarKey: Acme__Directory}
      - key: Acme__ContactEmail
        fromService: {type: web, name: opencert, envVarKey: Acme__ContactEmail}
